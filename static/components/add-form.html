<form id="add" class="card card-border bg-base-100 mb-6 shadow-sm">
  <div class="card-body">
    <h2 class="card-title">Add service</h2>
    <div class="grid gap-4 sm:grid-cols-2">
      <fieldset class="fieldset">
        <label class="label" for="n">Name (route slug)</label>
        <input id="n" class="input w-full" type="text" placeholder="sonarr" required pattern="[a-z0-9][a-z0-9\-]{0,31}">
      </fieldset>
      <fieldset class="fieldset">
        <label class="label" for="u">Upstream URL</label>
        <input id="u" class="input w-full" type="text" placeholder="http://192.168.1.10:8989" required>
      </fieldset>
      <fieldset class="fieldset">
        <label class="label" for="k">Upstream API key</label>
        <input id="k" class="input w-full" type="password" autocomplete="off">
      </fieldset>
      <fieldset class="fieldset">
        <label class="label" for="h">Key header</label>
        <input id="h" class="input w-full" type="text" value="X-Api-Key">
      </fieldset>
    </div>
    <div class="card-actions">
      <button class="btn btn-primary">Add</button>
    </div>
    <p id="addErr" class="text-error min-h-5 text-sm"></p>
  </div>
</form>
