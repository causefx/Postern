# Mounted as /etc/nginx/conf.d/default.conf, so everything here is at the http level.
# Replace postern.example.com with your name.

upstream postern_proxy {
    server postern:8080;
}

upstream postern_admin {
    server postern:8081;
}

# Lets a browser's WebSocket upgrade through to the upstream and closes the link otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name postern.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name postern.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Tell browsers to use HTTPS only. Postern does not send this itself, because it never sees the TLS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # nginx refuses a request body over 1 MB unless told otherwise. This is for what callers send through.
    client_max_body_size 100m;

    # Passed to both places below. Appending to X-Forwarded-For is right: Postern reads it from the
    # right and only believes the entries your proxy added.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Callers: the proxy, open to the internet.
    location /p/ {
        proxy_pass http://postern_proxy;
        # Send each chunk on as it arrives, for streaming responses.
        proxy_buffering off;
        proxy_request_buffering off;
        # Postern waits up to 60 s for an upstream to start answering and then replies 502 itself.
        # Wait longer than that, so callers see Postern's answer and not nginx's.
        proxy_read_timeout 120s;
    }

    # You: the admin UI, from your own networks only. Anyone else gets 403.
    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        deny all;
        proxy_pass http://postern_admin;
    }
}
