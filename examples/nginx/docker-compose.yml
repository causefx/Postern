# Postern behind nginx. nginx does not fetch certificates: put yours in ./certs
# (fullchain.pem and privkey.pem, from certbot or your own CA), or end HTTPS in front of nginx instead.
# Guide: docs/operations.md
#
#   cp ../.env.example .env                   # set ADMIN_PASSWORD in it
#   openssl rand -base64 32 > postern.key     # keep a copy somewhere else
#   edit nginx.conf: replace postern.example.com with your name
#   docker compose up -d

services:
  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - postern

  postern:
    image: ghcr.io/causefx/postern:latest   # pin a version once you are happy, e.g. :1.0.0
    restart: unless-stopped
    # No ports: only nginx, on this Docker network, can reach Postern.
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      LISTEN: ":8080"
      ADMIN_LISTEN: ":8081"
      # nginx ends HTTPS, so Postern must hand out Secure cookies and https:// addresses.
      POSTERN_SECURE: "1"
      # Believe the client address nginx reports. "private" is every address on this Docker network,
      # which holds only nginx and Postern. Use nginx's own address instead if you share the network.
      POSTERN_TRUSTED_PROXIES: private
      POSTERN_KEY_FILE: /run/secrets/postern_key
      # POSTERN_UPDATE_CHECK: "off"
    secrets:
      - postern_key
    volumes:
      - postern-data:/data

secrets:
  postern_key:
    file: ./postern.key

volumes:
  postern-data:
