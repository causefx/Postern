# Checks that gate a change. Runs on pull requests, and release.yml calls it
# on pushes to main so nothing is published from an untested commit.
# The title and Docker build-check jobs only apply to pull requests.
name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it gates publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    name: Conventional commit title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            refactor
            test
            build
            ci
          requireScope: false

  test:
    name: Go vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The image ships linux/arm64 too; catch a broken cross-build here
      # rather than during a release.
      - name: Cross-build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -o /dev/null ./cmd/postern

  # The stylesheet is embedded in the binary and committed. `npm run dev` rewrites it unminified
  # (the watcher), so a commit can quietly ship the big version, or an old one. Rebuild and compare.
  css:
    name: Stylesheet is built and minified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild web/app.css
        run: npm run build:css

      - name: Fail if the committed file differs
        run: |
          git diff --exit-code --stat web/app.css || {
            echo "::error file=web/app.css::web/app.css is not what 'npm run build:css' produces. Run it and commit the result (npm run dev writes an unminified copy)."
            exit 1
          }

  # Drives the real admin UI in Chromium against a freshly built binary (see e2e/README.md).
  # It also fails on any console error or Content-Security-Policy violation.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        working-directory: e2e
        run: npm test

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  docker:
    name: Docker build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
