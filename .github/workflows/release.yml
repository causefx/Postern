# Every push to main: test, then let Release Please open or update the
# Release pull request, then publish an image.
#
#   - Merging the Release pull request tags vX.Y.Z, publishes the GitHub
#     Release, and pushes ghcr.io/<repo>:X.Y.Z, :X.Y and :latest.
#   - Any other push to main pushes :edge and :sha-<short>.
#
# The tag is created with GITHUB_TOKEN, which does not start other
# workflows, so publishing happens here and not on a tag trigger.
#
# Optional: add a RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App
# token with contents + pull-requests write). Pull requests opened with it
# do run ci.yml, which is required if you make those checks mandatory on the
# Release pull request. Without it the workflow falls back to GITHUB_TOKEN.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    # A called workflow cannot request more than its caller grants, even
    # for jobs that are skipped here (the pull-request title check).
    permissions:
      contents: read
      pull-requests: read

  release-please:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  image:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASED: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a release this is the release commit; otherwise the pushed one.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}

      - name: Resolve app version
        id: ver
        shell: bash
        run: |
          if [[ "$RELEASED" == "true" ]]; then
            echo "version=${{ needs.release-please.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The runtime stage runs apk under emulation when building arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }},enable=${{ env.RELEASED == 'true' }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }},enable=${{ env.RELEASED == 'true' }}
            type=raw,value=latest,enable=${{ env.RELEASED == 'true' }}
            type=raw,value=edge,enable=${{ env.RELEASED != 'true' }}
            type=sha,prefix=sha-,enable=${{ env.RELEASED != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the image on the GitHub Release
        if: env.RELEASED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          body="$(gh release view "$TAG" --json body --jq '.body // ""')"
          if [[ "$body" == *"$image"* ]]; then
            exit 0
          fi
          printf '%s\n\nContainer image: `%s`\n' "$body" "$image" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
